name: Release

# Tagging a commit vX.Y.Z builds the Chrome and Firefox zips from it and attaches them to a
# GitHub release, so what's in the stores can be checked against this source.
on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun run zip && bun run zip:firefox
        env:
          WXT_STRATBASE_URL: https://stratbase.app
          WXT_OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
